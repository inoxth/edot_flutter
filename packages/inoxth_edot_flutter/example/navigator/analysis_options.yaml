# Inherits the repo-wide config so the example is held to the same strict
# language modes and lints as the package it demonstrates — an example that
# would not pass the package's own analysis is a poor example.
include: ../../../../analysis_options.yaml

linter:
  rules:
    # The example is a demo app, not a published library: its widgets and State
    # classes are not an API anyone documents. Off here only (it would otherwise
    # raise 5 findings), so the rule keeps its teeth on the packages that do
    # have a public surface.
    public_member_api_docs: false
