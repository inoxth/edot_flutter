name: inoxth_edot_flutter_example_shared
description: "Shared demo code for the inoxth_edot_flutter flavor example apps."
publish_to: 'none'

resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # The plugin the examples demonstrate - two directories up.
  inoxth_edot_flutter:
    path: ../../

  # Loads each flavor app's `.env` at the edge. DemoConfig itself stays a pure
  # Map -> config transform; only `loadDemoConfig` touches the file system.
  flutter_dotenv: ^6.0.1

  # The Network demo screen exercises all three traced request paths, so the shared
  # package needs the companion interceptor and both HTTP clients.
  inoxth_edot_flutter_dio:
    path: ../../../inoxth_edot_flutter_dio
  dio: ^5.4.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
