name: inoxth_edot_flutter_example_go_router
description: "The go_router flavor of the inoxth_edot_flutter example."
publish_to: 'none'

resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # The plugin this example demonstrates - two directories up.
  inoxth_edot_flutter:
    path: ../../

  # Shared demo code: the screens, widgets and env file -> config loader. This flavor
  # differs from the navigator flavor only in how it wires navigation.
  inoxth_edot_flutter_example_shared:
    path: ../shared

  # The navigation library this flavor demonstrates.
  go_router: ^17.4.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Where this flavor reads its configuration from (see lib/main.dart). The
  # directory is declared rather than the file, because the file itself is
  # gitignored: a fresh clone must still analyze and build, and it does when the
  # declared asset is a directory that always exists. The app then finds no
  # config at runtime and shows its missing-config screen, which is the intent.
  #
  # The file must not begin with a dot. Flutter's directory-asset globbing skips
  # dotfiles, so `env/.env` would build fine and bundle nothing.
  assets:
    - env/
