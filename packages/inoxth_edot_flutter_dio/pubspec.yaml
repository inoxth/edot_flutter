name: inoxth_edot_flutter_dio
description: >-
  Dio integration for inoxth_edot_flutter. Traces every request a Dio instance
  makes as a client span, tagged with the screen it came from.
version: 0.1.0-dev.1
repository: https://github.com/inoxth/edot_flutter
issue_tracker: https://github.com/inoxth/edot_flutter/issues

resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  dio: ^5.4.0
  flutter:
    sdk: flutter
  inoxth_edot_flutter: ^0.1.0-dev.1

dev_dependencies:
  flutter_lints: ^6.0.0
  # Test-only: the all-layers-at-once test drives EdotHttpClient alongside Dio, so it
  # imports package:http directly. Nothing consumers resolve depends on it.
  http: ^1.2.0
  flutter_test:
    sdk: flutter
