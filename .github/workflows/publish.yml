# Publishes both packages to pub.dev from a version tag.
#
# Both packages ship under one version and one tag - ADR-0017. The tag is what
# releases; see the Releasing section of CONTRIBUTING.md for how to cut one.
#
# ---------------------------------------------------------------------------
# This file is inert until the settings below exist. They are applied by hand
# (DEV-1258), not by this repo, so it cannot assert them - it only names them.
#
#   GitHub: an environment named `pub.dev`, with a required reviewer.
#
#   pub.dev, on the Admin tab of BOTH packages:
#     - Enable publishing from GitHub Actions
#     - Repository:  inoxth/edot_flutter
#     - Tag pattern: v{{version}}
#     - Require the GitHub Actions environment: pub.dev
#
# Requiring the environment is what stops any other workflow in this repository
# from minting a publish token; the reviewer is what stops a mistyped tag.
#
# Two things that will reject a release rather than break subtly:
#   - The version in each pubspec.yaml must equal the tag's version.
#   - `publish_to: none` must be gone from both pubspecs (DEV-1257).
# ---------------------------------------------------------------------------

name: publish

on:
  push:
    # Narrower than `v*`, which would also match a tag like `verified-fix`.
    tags: ['v[0-9]*']

jobs:
  # The same gate pull requests get. Sharing the file rather than copying it is
  # the point: a release path that checks something different from the review
  # path is worth nothing.
  verify:
    uses: ./.github/workflows/verify.yml

  publish-core:
    needs: verify
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/inoxth_edot_flutter
      environment: pub.dev

  # The Dio package declares `inoxth_edot_flutter: ^<version>`, and that
  # constraint cannot resolve until core is actually live. `needs` orders the
  # jobs but says nothing about pub.dev having finished indexing, so wait for
  # the version to be fetchable before letting the Dio publish start.
  #
  # Its own job because a job that calls a reusable workflow cannot also run
  # steps.
  await-core:
    needs: publish-core
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the core version to appear on pub.dev
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://pub.dev/api/packages/inoxth_edot_flutter/versions/${version}"

          for attempt in $(seq 1 30); do
            if curl -sf "$url" > /dev/null; then
              echo "inoxth_edot_flutter ${version} is live."
              exit 0
            fi
            echo "attempt ${attempt}/30: not indexed yet, retrying in 10s"
            sleep 10
          done

          echo "::error::inoxth_edot_flutter ${version} did not appear on pub.dev within 5 minutes."
          echo "::error::Not publishing the Dio package against a core that is not there."
          exit 1

  publish-dio:
    needs: [verify, await-core]
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/inoxth_edot_flutter_dio
      environment: pub.dev

  # One GitHub release per version tag, bodied from the CHANGELOG prose rather
  # than from generated commit notes - the entries are written for readers and
  # reference the ADRs, which a commit list would replace with nothing useful.
  #
  # `needs` is the gate, not decoration: a job runs only when everything it
  # needs succeeded, so a run where core published and Dio did not creates no
  # release. Announcing a version that is only half on pub.dev would hide
  # exactly the failure the ordering and the two approvals exist to expose.
  #
  # Its own job for the same reason `await-core` is one: a job that calls a
  # reusable workflow cannot also run steps.
  release:
    needs: [publish-core, publish-dio]
    runs-on: ubuntu-latest
    permissions:
      # Not inherited - the publish jobs grant `id-token` for OIDC and nothing
      # else. Creating a release writes to the repository.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # The `$0 == want` comparison is the whole point: it matches the
          # entire heading line. A prefix match (`/^## 0\.1\.0/`) finds
          # `## 0.1.0-dev.2` when asked for `0.1.0`, and `## 0.1.1` when asked
          # for `0.1.10` - shipping the wrong notes without ever failing.
          section() {
            awk -v want="## $2" '
              $0 == want { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' "$1"
          }

          core=$(section packages/inoxth_edot_flutter/CHANGELOG.md "$version")
          dio=$(section packages/inoxth_edot_flutter_dio/CHANGELOG.md "$version")

          # Both packages carry an entry for every released version, so a
          # missing one means the release was cut wrong. Fail rather than
          # publish an empty release nobody can correct afterwards.
          if [ -z "${core//[[:space:]]/}" ] || [ -z "${dio//[[:space:]]/}" ]; then
            echo "::error::No CHANGELOG section for ${version} in one or both packages."
            exit 1
          fi

          {
            printf '## inoxth_edot_flutter\n'
            printf '%s\n' "$core"
            printf '## inoxth_edot_flutter_dio\n'
            printf '%s\n' "$dio"
          } > "$RUNNER_TEMP/notes.md"

          # A semver prerelease suffix is the only thing separating 0.1.0-dev.2
          # from 0.1.0. pub.dev already declines to serve it as latest stable;
          # an unmarked release would contradict that by showing as Latest.
          args=(--title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md")
          case "$version" in *-*) args+=(--prerelease) ;; esac

          # Idempotent: a re-run of a released tag leaves the existing release
          # alone rather than failing the workflow or creating a second one.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it alone."
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" "${args[@]}"

# Note on the reusable workflow, which is dart-lang's own:
#
# It runs `dart pub get` and `dart pub publish --dry-run` inside
# working-directory. Both packages are pub workspace members carrying
# `resolution: workspace`, and `dart pub get` from a member directory resolves
# at the workspace root, so that part is fine - verified locally.
#
# `resolution: workspace` does survive into the published archive, and costs a
# consumer nothing - settled by the 0.1.0-dev.1 publish (DEV-1257). A scratch
# project depending on both packages resolves them `source: hosted` with the key
# present in the downloaded pubspec. Dart's workspace docs are silent on this, so
# it is recorded here rather than left to be rediscovered.
#
# It also provisions its own Flutter via flutter-actions/setup-flutter with no
# version pinned, so the publish path does not run on the 3.44.0 that `verify`
# pins. Acceptable - publishing does not compile the plugin - but it does mean
# the dry-run's analysis happens under a different SDK than the gate's.
